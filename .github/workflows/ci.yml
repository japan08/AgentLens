name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Smoke test — demo evaluation
        run: python -m agentlens demo --out /tmp/agentlens-demo
      - name: Smoke test — dataset validation
        run: |
          python -m agentlens validate --cases examples/cases.jsonl --traces examples/traces.sample.jsonl
          python -m agentlens validate --cases examples/intent_cases.jsonl --traces examples/intent_traces.sample.jsonl
