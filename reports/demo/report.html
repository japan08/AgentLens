<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgentLens Report — examples/cases.jsonl</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
  :root{--bg:#0f1419;--panel:#1a2230;--panel2:#212c3f;--text:#e8eef5;--muted:#93a4b8;--green:#2ea043;--red:#e5534b;--blue:#3b82f6;--border:#2c3a50}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
  header{padding:32px 24px 12px;max-width:1120px;margin:0 auto;border-bottom:1px solid var(--border)}
  header h1{font-size:28px;font-weight:700;letter-spacing:-.5px}
  header h1 .lens{color:var(--blue)}
  header p{color:var(--muted);margin-top:6px;font-size:14px}
  main{max-width:1120px;margin:0 auto;padding:20px 24px 60px}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:20px 0}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px;transition:border-color .2s}
  .card:hover{border-color:var(--blue)}
  .card b{font-size:22px;font-weight:700;display:block;margin-bottom:4px}
  .card span{color:var(--muted);font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:.5px}
  .card.success b{color:var(--green)}.card.fail b{color:var(--red)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
  @media(max-width:760px){.grid2{grid-template-columns:1fr}}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:18px 20px;margin-bottom:12px}
  .panel h2{font-size:15px;font-weight:600;margin-bottom:14px}
  .bar-row{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:13px}
  .bar-row .name{width:120px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex-shrink:0}
  .bar-track{flex:1;background:#0b0f14;border-radius:6px;height:12px;overflow:hidden}
  .bar-fill{height:100%;background:var(--green);border-radius:6px;transition:width .6s ease}
  .bar-fill.bad{background:var(--red)}
  .bar-label{font-size:12px;color:var(--muted);white-space:nowrap;min-width:70px;text-align:right}
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
  .filters button{background:var(--panel2);color:var(--muted);border:1px solid var(--border);border-radius:8px;padding:6px 14px;cursor:pointer;font-size:13px;font-weight:500;transition:all .15s}
  .filters button:hover,.filters button.active{border-color:var(--blue);color:#fff;background:#1e3260}
  #search{flex:1;min-width:160px;background:var(--panel2);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:6px 12px;font-size:13px;outline:none;transition:border-color .15s}
  #search:focus{border-color:var(--blue)}
  .table-wrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:top}
  th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.4px;white-space:nowrap}
  tr:last-child td{border-bottom:none}tr:hover td{background:#1e2b3a}
  .pass{color:#3fb950;font-weight:600}.fail{color:var(--red);font-weight:600}
  .checks{font-size:11px;color:var(--muted);line-height:1.8}
  .checks .ok{color:#3fb950}.checks .no{color:var(--red)}
  .reasons{color:var(--muted);font-size:12px;line-height:1.6}
  .lat-ok{color:#3fb950}.lat-warn{color:#f0a841}.lat-na{color:var(--muted)}
  footer{color:var(--muted);text-align:center;padding:0 20px 30px;font-size:12px}
</style>
</head>
<body>
<header>
  <h1>Agent<span class="lens">Lens</span> &mdash; Evaluation Report</h1>
  <p>Generated 2026-10-29T17:46:55+00:00 &nbsp;&middot;&nbsp; dataset: examples/cases.jsonl &nbsp;&middot;&nbsp; source: sample traces</p>
</header>
<main>
  <section class="cards" id="cards"></section>
  <div class="grid2">
    <section class="panel"><h2>Success by tag</h2><div id="tagBars"></div></section>
    <section class="panel"><h2>Failure breakdown</h2><div id="failBars"></div></section>
  </div>
  <section class="panel">
    <h2>Cases</h2>
    <div class="filters">
      <button data-filter="all" class="active" type="button">All</button>
      <button data-filter="passed" type="button">Passed</button>
      <button data-filter="failed" type="button">Failed</button>
      <input id="search" type="search" placeholder="Search cases…">
    </div>
    <div class="table-wrap"><table>
      <thead><tr><th>Case</th><th>Result</th><th>Input</th><th>Latency</th><th>Cost</th><th>Checks</th><th>Why it failed</th></tr></thead>
      <tbody id="caseRows"></tbody>
    </table></div>
  </section>
</main>
<footer>AgentLens &mdash; Evaluate AI agents on task success, not just answer quality</footer>
<script>
const REPORT={"tool": "agentlens", "generated_at": "2026-10-29T17:46:55+00:00", "meta": {"dataset": "examples/cases.jsonl", "source": "sample traces"}, "summary": {"total_cases": 14, "passed": 11, "failed": 3, "task_success_rate": 78.57, "intent_accuracy": 100.0, "tool_sequence_accuracy": 88.89, "tool_args_accuracy": 87.5, "escalation_accuracy": 75.0, "judge_pass_rate": 100.0, "avg_judge_score": 0.85, "avg_latency_ms": 1072.9, "p95_latency_ms": 2000, "total_cost_usd": 0.0179, "cost_per_success_usd": 0.001627, "failure_breakdown": {"tool_sequence": 1, "forbidden_tools": 1, "escalation": 1, "tool_args": 1}, "by_tag": {"smoke": {"total": 1, "passed": 1, "success_rate": 100.0}, "orders": {"total": 2, "passed": 1, "success_rate": 50.0}, "billing": {"total": 4, "passed": 3, "success_rate": 75.0}, "safety": {"total": 2, "passed": 1, "success_rate": 50.0}, "handover": {"total": 1, "passed": 0, "success_rate": 0.0}, "pricing": {"total": 1, "passed": 1, "success_rate": 100.0}, "account": {"total": 1, "passed": 1, "success_rate": 100.0}, "catalog": {"total": 2, "passed": 2, "success_rate": 100.0}, "support": {"total": 1, "passed": 1, "success_rate": 100.0}, "multi-turn": {"total": 1, "passed": 1, "success_rate": 100.0}, "judge": {"total": 1, "passed": 1, "success_rate": 100.0}}}, "cases": [{"id": "greet-1", "input": "hi there", "tags": ["smoke"], "passed": true, "checks": {"intent": true, "flow": null, "forbidden_intent": null, "tool_sequence": null, "tool_args": null, "forbidden_tools": null, "tool_budget": null, "tool_loop": null, "answer": true, "judge": null, "escalation": null, "latency": null, "cost": null}, "reasons": [], "latency_ms": 320, "cost_usd": 0.0004, "judge_score": null, "judge_rationale": null}, {"id": "order-status-1", "input": "where is my order A1023", "tags": ["orders"], "passed": true, "checks": {"intent": true, "flow": null, "forbidden_intent": null, "tool_sequence": true, "tool_args": true, "forbidden_tools": null, "tool_budget": null, "tool_loop": tru  990, "cost_usd": 0.0012, "judge_score": null, "judge_rationale": null}, {"id": "complaint-1", "input": "this is unacceptable, nothing works", "tags": ["support"], "passed": true, "checks": {"intent": true, "flow": true, "forbidden_intent": null, "tool_sequence": null, "tool_args": null, "forbidden_tools": null, "tool_budget": null, "tool_loop": null, "answer": null, "judge": null, "escalation": true, "latency": null, "cost": null}, "reasons": [], "latency_ms": 720, "cost_usd": 0.0008, "judge_score": null, "judge_rationale": null}, {"id": "mt-refund-1", "input": "my order never arrived", "tags": ["multi-turn", "billing"], "passed": true, "checks": {"intent": true, "flow": null, "forbidden_intent": null, "tool_sequence": true, "tool_args": true, "forbidden_tools": null, "tool_budget": true, "tool_loop": true, "answer": true, "judge": null, "escalation": true, "latency": null, "cost": null}, "reasons": [], "latency_ms": 2000, "cost_usd": 0.0025, "judge_score": null, "judge_rationale": null}, {"id": "subseq-1", "input": "check stock and price for headphones", "tags": ["catalog"], "passed": true, "checks": {"intent": true, "flow": null, "forbidden_intent": null, "tool_sequence": true, "tool_args": true, "forbidden_tools": null, "tool_budget": null, "tool_loop": true, "answer": true, "judge": null, "escalation": null, "latency": null, "cost": null}, "reasons": [], "latency_ms": 1500, "cost_usd": 0.0019, "judge_score": null, "judge_rationale": null}, {"id": "explain-1", "input": "why does my refund take 5 days", "tags": ["judge", "billing"], "passed": true, "checks": {"intent": true, "flow": null, "forbidden_intent": null, "tool_sequence": null, "tool_args": null, "forbidden_tools": null, "tool_budget": null, "tool_loop": null, "answer": null, "judge": true, "escalation": null, "latency": null, "cost": null}, "reasons": [], "latency_ms": 800, "cost_usd": 0.001, "judge_score": 0.85, "judge_rationale": "Covers timeline and bank processing, polite tone"}]};
const s=REPORT.summary;
let filter='all';
const $=id=>document.getElementById(id);
const esc=t=>(t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const fmt=(v,sfx)=>(v===null||v===undefined)?'—':v+(sfx||'');
const cardData=[
  [fmt(s.task_success_rate,'%'),'task success',s.task_success_rate>=80?'success':'fail'],
  [s.passed+'/'+s.total_cases,'cases passed',''],
  [fmt(s.intent_accuracy,'%'),'intent accuracy',''],
  [fmt(s.tool_sequence_accuracy,'%'),'tool sequence',''],
  [fmt(s.tool_args_accuracy,'%'),'tool arguments',''],
  [fmt(s.escalation_accuracy,'%'),'escalation accuracy',''],
  [fmt(s.avg_latency_ms,' ms'),'avg latency',''],
  [fmt(s.p95_latency_ms,' ms'),'p95 latency',''],
  [fmt(s.cost_per_success_usd,' USD'),'cost / success',''],
];
$('cards').innerHTML=cardData.map(([v,l,cls])=>`<div class="card ${cls}"><b>${v}</b><span>${l}</span></div>`).join('');
const tags=Object.entries(s.by_tag||{}).sort((a,b)=>b[1].success_rate-a[1].success_rate);
$('tagBars').innerHTML=tags.length?tags.map(([name,b])=>`<div class="bar-row"><span class="name" title="${esc(name)}">${esc(name)}</span><div class="bar-track"><div class="bar-fill" style="width:${b.success_rate}%"></div></div><span class="bar-label">${b.passed}/${b.total} &middot; ${b.success_rate}%</span></div>`).join(''):'<p class="reasons">No tags in this report.</p>';
const fails=Object.entries(s.failure_breakdown||{});
const maxFail=Math.max(1,...fails.map(([,c])=>c));
$('failBars').innerHTML=fails.length?fails.map(([name,c])=>`<div class="bar-row"><span class="name" title="${esc(name)}">${esc(name)}</span><div class="bar-track"><div class="bar-fill bad" style="width:${(c/maxFail)*100}%"></div></div><span class="bar-label">${c} failure${c===1?'':'s'}</span></div>`).join(''):'<p class="reasons">No failures 🎉</p>';
function renderCases(){
  const q=($('search').value||'').toLowerCase();
  const rows=(REPORT.cases||[]).filter(c=>{
    if(filter==='passed'&&!c.passed)return false;
    if(filter==='failed'&&c.passed)return false;
    return !q||c.id.toLowerCase().includes(q)||(c.input||'').toLowerCase().includes(q);
  });
  $('caseRows').innerHTML=rows.map(c=>{
    const chk=Object.entries(c.checks||{}).filter(([,v])=>v!==null&&v!==undefined)
      .map(([k,v])=>`<span class="${v?'ok':'no'}">${v?'✓':'✗'} ${k}</span>`).join(' &middot; ');
    const lat=c.latency_ms;
    const lc=lat===null?'lat-na':lat>3000?'lat-warn':'lat-ok';
    const ls=lat===null?'—':lat+' ms';
    const cs=(c.cost_usd===null||c.cost_usd===undefined)?'—':'$'+c.cost_usd.toFixed(4);
    return `<tr><td><code style="font-size:12px">${esc(c.id)}</code></td><td class="${c.passed?'pass':'fail'}">${c.passed?'✅ pass':'❌ fail'}</td><td style="max-width:220px;word-break:break-word">${esc(c.input)}</td><td class="${lc}">${ls}</td><td class="lat-na">${cs}</td><td class="checks">${chk}</td><td class="reasons">${(c.reasons||[]).map(esc).join('<br>')}</td></tr>`;
  }).join('')||'<tr><td colspan="7" class="reasons">No cases match.</td></tr>';
}
document.querySelectorAll('.filters button').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.filters button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');filter=btn.dataset.filter;renderCases();
  });
});
$('search').addEventListener('input',renderCases);
renderCases();
</script>
</body>
</html>
